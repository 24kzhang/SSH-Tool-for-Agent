[project]
name = "remote-tool"
version = "1.1.1"
description = "本地远程 Linux 控制中间程序"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "paramiko>=3.4",
    "cryptography>=42",
    "requests>=2.32",
]

[project.optional-dependencies]
test = [
    "pytest>=8.2",
    "httpx>=0.27",
]
build = [
    "pyinstaller>=6.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
